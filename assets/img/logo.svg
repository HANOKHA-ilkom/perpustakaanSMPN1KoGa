<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <!-- Outer Shield Gradient -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e73be"/>
      <stop offset="100%" stop-color="#0b4884"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Base Pentagon Shield -->
  <polygon points="100,10 185,45 155,160 100,190 45,160 15,45" 
           fill="url(#shieldGrad)" stroke="#f1c40f" stroke-width="6" stroke-linejoin="round" filter="url(#shadow)"/>
  
  <!-- Inner Shield Border -->
  <polygon points="100,18 175,49 148,152 100,179 52,152 25,49" 
           fill="none" stroke="#ffffff" stroke-width="2" stroke-dasharray="4,2"/>

  <!-- Sun Rays / Lotus Pattern -->
  <circle cx="100" cy="85" r="46" fill="#f39c12" opacity="0.3"/>
  <circle cx="100" cy="85" r="38" fill="#ffffff" opacity="0.2"/>

  <!-- Central Star -->
  <polygon points="100,50 104,65 119,65 107,75 111,90 100,81 89,90 93,75 81,65 96,65" 
           fill="#f1c40f" stroke="#d68910" stroke-width="1"/>

  <!-- Open Book Emblem -->
  <path d="M 68 115 Q 100 105 100 120 Q 100 105 132 115 L 132 135 Q 100 125 100 138 Q 100 125 68 135 Z" 
        fill="#ffffff" stroke="#0b4884" stroke-width="1.5"/>
  <line x1="100" y1="120" x2="100" y2="138" stroke="#0b4884" stroke-width="2"/>

  <!-- Yellow Ribbon Banner -->
  <path d="M 38 145 L 50 138 L 150 138 L 162 145 L 150 155 L 50 155 Z" 
        fill="#f1c40f" stroke="#b7950b" stroke-width="2"/>
  <polygon points="38,145 28,152 38,160 50,155 38,145" fill="#d4ac0d"/>
  <polygon points="162,145 172,152 162,160 150,155 162,145" fill="#d4ac0d"/>

  <!-- Text KOTAGAJAH -->
  <text x="100" y="150" font-family="'Arial Black', Impact, sans-serif" font-weight="bold" font-size="13" 
        fill="#0b4884" text-anchor="middle" letter-spacing="1.5">KOTAGAJAH</text>
  
  <!-- Top Text SMPN 1 -->
  <text x="100" y="40" font-family="'Arial', sans-serif" font-weight="bold" font-size="10" 
        fill="#ffffff" text-anchor="middle" letter-spacing="1">SMP N 1</text>
</svg>

